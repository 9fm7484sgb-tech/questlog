.syncbadge{display:inline-flex;align-items:center;gap:6px;border:1px solid #415779;background:#162439;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:750;color:#b6def0;text-decoration:none}

const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

const dateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const advance=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return dateStr(d)};
const daysBetween=(a,b)=>Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))-Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/86400000);
const formatDate=s=>parseDay(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const dateInfo=s=>({weekday:parseDay(s).getDay(),idx:daysBetween(START,s)});
const getDay=s=>({...defaultDay(),...(state.days[s]||{})});
function save(which='day'){
  try{
    if(cloud.user){
      localStorage.setItem(cacheKey(),JSON.stringify(state));
      const pending=getPending();
      if(which==='all')Object.keys(state.days).forEach(d=>pending.add(d));
      else if(which==='profile')pending.add('@profile');
      else pending.add(selected);
      setPending(pending); queueCloud();
    } else localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){cloud.message='Local storage failed — export a backup.';return false;}
}

const progress=(d,s,id)=>{
 const value=+(d[id]||0);if(id==='movement'&&dateInfo(s).weekday===0&&d.restDone)return 'Full';
 if(value>=GOAL[d.mode]?.[id] && value>0)return 'Full';if(value>=MIN[id])return 'Minimum';return 'Not yet';
};
function outcome(s){const d=getDay(s),statuses=HABITS.map(h=>progress(d,s,h.id));const complete=statuses.filter(t=>t!=='Not yet').length,full=statuses.filter(t=>t==='Full').length;
 const tracked=HABITS.some(h=>+d[h.id]>0)||!!d.restDone;const xp=complete*20+full*10+(complete===6?50:complete>=4?15:0);const gold=complete*10+(complete===6?25:0);return{d,complete,full,tracked,xp,gold,statuses};}
function allStats(){const keys=Object.keys(state.days).filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)).sort();let xp=0,gold=0,fullDays=0,logged=0,words=0,minutes={},best=0,streak=0,prior=null,qualified=0;
 HABITS.forEach(h=>minutes[h.id]=0);
 for(const s of keys){const o=outcome(s),d=o.d;xp+=o.xp;gold+=o.gold;words+=Math.max(0,+d.words||0);if(o.complete===6)fullDays++;if(o.tracked)logged++;HABITS.forEach(h=>minutes[h.id]+=Math.max(0,+d[h.id]||0));
 if(o.tracked&&o.complete>=3){streak=prior===advance(s,-1)?streak+1:1;best=Math.max(best,streak);prior=s;}else if(o.tracked){streak=0;prior=s;}
 }return{keys,xp,gold,fullDays,logged,words,minutes,best,level:Math.floor(xp/200)+1};}
const statIcon=(t)=>({gold:'◈',xp:'✦',streak:'↗',days:'✓'}[t]||'◆');
const statCard=(title,value,hint,color)=>`<div class="stat"><div class="label">${safe(title)}</div><div class="val ${color}">${safe(value)}</div><div class="hint">${safe(hint)}</div></div>`;
const pill=(s)=>`<span class="pill ${s==='Full'?'gold':s==='Minimum'?'good':''}">${s==='Full'?'FULL CLEAR':s==='Minimum'?'DONE':'NOT YET'}</span>`;
const bar=(done,total,kind='')=>`<div class="bar ${kind}"><span style="width:${Math.max(0,Math.min(100,total?100*done/total:0))}%"></span></div>`;
function workout(s){const info=dateInfo(s);const wk=info.weekday===0?6:info.weekday-1;return SOURCE.workouts[wk]||SOURCE.workouts[0]}
function pvpQuest(s){let ix=dateInfo(s).idx;return SOURCE.pvp[((ix%42)+42)%42]}
const goal=(d,s,id)=>id==='movement'&&dateInfo(s).weekday===0?'recovery':GOAL[d.mode][id];
function milestoneData(stats){const completed=(h)=>Object.keys(state.days).filter(s=>outcome(s).statuses[HABITS.findIndex(a=>a.id===h)]!=='Not yet').length;
 return [
 ['✦','First Quest','Complete any quest',stats.logged>=1],['✎','The Scribe','Write 500 words',stats.words>=500],['▤','Wordsmith','Write 5,000 words',stats.words>=5000],['♞','Tactician','Complete 7 chess days',completed('chess')>=7],['⚔','Duelist','Complete 7 PvP drills',completed('pvp')>=7],['◆','Strength Arc','Complete 10 workout days',completed('movement')>=10],['♧','Party Member','Play with friends on 10 days',completed('friends')>=10],['◇','Inner Voice','Reflect on 7 days',completed('journal')>=7],['✷','Perfect Run','Complete 6/6 quests in a day',stats.fullDays>=1],['↗','Combo Master','Get a 7-day 3+ quest streak',stats.best>=7],['♛','Boss Slayer','Defeat a weekly boss',bossWins()>=1],['⬟','Campaign Veteran','Track 28 days',stats.logged>=28]
 ];}
function bossWins(){let count=0;for(let w=0;w<6;w++){let days=0;for(let i=0;i<7;i++)if(outcome(advance(START,w*7+i)).complete>=4)days++;if(days>=4)count++;}return count;}
function sideNavigation(){const markup=(mobile)=>NAV.filter(([k])=>!mobile||k!=='settings').map(([k,title])=>`<button class="${mobile?'':'navBtn '} ${page===k?'active':''}" data-nav="${k}">${mobile?`<strong>${ICONS[k]}</strong><span>${k==='character'?'Hero':k==='trophies'?'Trophies':k==='quests'?'Quests':k==='map'?'Map':k==='history'?'History':'Home'}</span>`:`<span class="nicon">${ICONS[k]}</span>${safe(title)}`}</button>`).join('');document.getElementById('desktopNav').innerHTML=markup(false);document.getElementById('mobileNav').innerHTML=markup(true)}
function header(title,eyebrow,subtitle){return `<div class="topline"><div><div class="eyebrow">${safe(eyebrow)}</div><h1 class="pageTitle">${safe(title)}</h1><p class="lede">${safe(subtitle)}</p></div><div class="row" style="align-items:center"><button class="syncbadge ${cloud.user?(cloud.status==='connected'?'ok':'warn'):''}" data-nav="settings">${safe(syncLabel())}</button><div class="datepick"><button data-shift="-1" title="Previous day">‹</button><input type="date" id="dateSelector" value="${selected}" aria-label="Selected day"><button data-shift="1" title="Next day">›</button></div></div></div>`}
function questRows(d,st){return HABITS.map((h,i)=>{const label=st[i], full=label==='Full', done=label!=='Not yet',t=goal(d,selected,h.id);return `<div class="questrow" data-complete="${done}"><div class="questIcon">${h.icon}</div><div><div class="questName">${h.name}</div><div class="questMeta">${(+(d[h.id]||0))} min / ${t==='recovery'?'recovery day':t+' min target'}</div></div><div class="questStatus ${full?'full':done?'done':''}">${full?'★ FULL':done?'✓ DONE':'○ OPEN'}</div></div>`}).join('')}
function hero(stats){const level=stats.level, pct=stats.xp%200;return `<div class="banner"><div class="heroStats"><div class="crest">✦</div><div><div class="eyebrow">LEVEL ${level} ADVENTURER</div><div class="lvName">${safe(state.name||'Adventurer')}</div><div class="heroCopy">${TITLES[Math.min(level-1,TITLES.length-1)]} • Choose progress over perfection</div></div></div><div class="heroRight"><div class="xpNum">${stats.xp.toLocaleString()} XP TOTAL · ${pct}/200 TO NEXT LEVEL</div>${bar(pct,200)}<div class="small">LEVEL ${level} → LEVEL ${level+1}</div></div></div>`}
function renderHome(){const s=allStats(),o=outcome(selected),p=pvpQuest(selected),w=workout(selected);return header('Command Center','YOUR PERSONAL ADVENTURE',`Six skills. One life. ${formatDate(selected)}`)+hero(s)+`<div class="statgrid">${statCard('Quest XP',s.xp.toLocaleString(),'20 XP minimum · +10 full','accentV')}${statCard('Gold earned',s.gold.toLocaleString(),'Earned from completed quests','accentA')}${statCard('Best streak',s.best+' days','3+ quests creates momentum','accentG')}${statCard('Days logged',s.logged,'Your 42-day campaign','accentC')}</div>${characterDeck()}<div class="split"><div><section class="card"><div class="cardHeader"><h3>Today's quest checklist</h3><span class="pill ${o.complete===6?'gold':''}">${o.complete} / 6 FINISHED</span></div>${bar(o.complete,6,'green')}${questRows(o.d,o.statuses)}<div style="margin-top:17px;display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap"><span class="small">Today's earned rewards: <strong class="goldtext">${o.xp} XP + ${o.gold} gold</strong></span><button class="button primary" data-nav="quests">Log your quests →</button></div></section><section class="section card"><div class="cardHeader"><h3>42-day skill campaign</h3><span class="pill">CHAPTER ${Math.floor((((dateInfo(selected).idx%42)+42)%42)/7)+1} / 6</span></div><div class="eyebrow">TODAY'S PVP SKILL</div><h2 style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;margin:8px 0 8px">${safe(p.title)}</h2><p style="color:#c8d3e8;font-size:12px;line-height:1.65">${safe(p.drill)}</p><div class="listLinks"><a class="bigLink" target="_blank" rel="noopener noreferrer" href="${safe(p.url)}">↗ Learn this skill</a><button class="button sm" data-nav="map">Open campaign map</button></div></section></div><div><section class="card"><div class="cardHeader"><h3>Today's workout</h3><span class="pill">${safe(o.d.equipment)}</span></div><div class="eyebrow">${safe(w.day.toUpperCase())} • ${safe(w.focus)}</div>${safe((o.d.equipment==='Weights'?w.weights:w.bodyweight)).split('\n').map(x=>`<div class="planLine">✓ ${x}</div>`).join('')}<div class="listLinks"><a href="${safe(o.d.equipment==='Weights'?w.weights_url:w.body_url)}" class="bigLink" target="_blank" rel="noopener noreferrer">↗ Exercise technique</a><button class="button sm" data-nav="quests">Log workout</button></div><p class="small" style="margin:14px 0 0">${safe(w.note)}</p></section><section class="section card"><h3>Tonight's checkpoint</h3><p style="font-size:13px;color:#c3cee2;line-height:1.7">What went well today? What got in the way? What's your first step tomorrow?</p><div class="small">The journal is part of your quest, not a test.</div><button class="button" style="margin-top:12px" data-nav="quests">Open reflection →</button></section><section class="section hintbox"><b class="goldtext">YOUR NEXT WIN</b><br>${o.complete===6?'All six quests complete today. Nice work—tomorrow is a fresh run.':`Complete one more habit to earn ${o.complete===5?'your full-clear bonus':'more quest XP'}. Small sessions count.`}</section></div></div>`}
function formHabit(h,d,status){let target=goal(d,selected,h.id);return `<div class="formquest"><div class="formquesthead"><div class="questIcon">${h.icon}</div><div style="flex:1"><h3>${safe(h.name)} <span style="font-size:10px;color:var(--violet)">· ${h.role}</span></h3><div class="meterhint">${h.hint} · ${target==='recovery'?'Recovery day':'Goal '+target+' min'} · Minimum ${MIN[h.id]} min</div></div>${pill(status)}</div><div class="entryrow"><div class="entry" style="width:126px"><label for="minutes-${h.id}">Minutes done</label><input id="minutes-${h.id}" type="number" min="0" step="1" max="9999" data-number="${h.id}" value="${+d[h.id]||0}"></div><button class="plus" data-add="${h.id}" data-min="5">+5m</button><button class="plus" data-add="${h.id}" data-min="10">+10m</button><span class="small">${+d[h.id]||0} / ${target==='recovery'?'rest':target} </span></div>${h.id==='writing'?`<div class="entry" style="margin-top:11px;max-width:220px"><label for="wordCount">Words written today</label><input type="number" min="0" step="1" id="wordCount" data-number="words" value="${+d.words||0}"></div>`:''}${h.id==='movement'?`<div class="checkline"><label><input type="checkbox" id="restDone" ${d.restDone?'checked':''}> Sunday recovery complete (gentle movement or genuine rest)</label></div>`:''}</div>`}
function workoutView(d){const w=workout(selected),isWeights=d.equipment==='Weights',plan=(isWeights?w.weights:w.bodyweight).split('\n');return `<div class="card"><div class="cardHeader"><h3>Fitness loadout</h3><span class="pill">${safe(w.focus)}</span></div><div class="selectrow" style="margin-bottom:15px"><button class="choice ${isWeights?'selected':''}" data-equip="Weights">◆ Dumbbells</button><button class="choice ${!isWeights?'selected':''}" data-equip="No equipment">◇ No equipment</button></div><div class="eyebrow">${safe(w.day.toUpperCase())} · ${w.goal===0?'RECOVERY':w.goal+' MIN GOAL'}</div><div class="mission">${plan.map(p=>`<div class="planLine">${safe(p)}</div>`).join('')}<p class="small">${safe(w.note)}</p><a class="bigLink" href="${safe(isWeights?w.weights_url:w.body_url)}" target="_blank" rel="noopener noreferrer">↗ Watch / read technique (${isWeights?'dumbbells':'bodyweight'})</a></div><details><summary style="cursor:pointer;font-size:12px;font-weight:800;color:#baadff">OPEN COMPLETE FORM LIBRARY (${SOURCE.demos.length} ENTRIES)</summary><div style="max-height:270px;overflow:auto;margin-top:11px">${SOURCE.demos.map(item=>`<div class="fitnessrow"><div><b style="font-size:12px">${safe(item.name)}</b><p class="small" style="margin:3px 0">${safe(item.cue)}</p><span class="small">${safe(item.kind)}</span></div><a class="button sm" target="_blank" rel="noopener noreferrer" href="${safe(item.url)}">Guide ↗</a></div>`).join('')}</div></details></div>`}
function renderQuests(){const o=outcome(selected),d=o.d,p=pvpQuest(selected);return header('Daily Quest Log','TRAIN • CREATE • CONNECT',`You're recording ${formatDate(selected)}. Everything saves automatically.`)+`<div class="statgrid">${statCard('Completed quests',o.complete+' / 6','Minimum effort earns credit','accentG')}${statCard('XP today',o.xp,'Up to 230 XP for full clear','accentV')}${statCard('Gold today',o.gold,'10 per completed quest','accentA')}${statCard('Quest rank',o.complete===6?'S':o.complete>=5?'A':o.complete>=4?'B':o.complete>=2?'C':'D','D → C → B → A → S','accentC')}</div><div class="split"><div><section class="card"><div class="cardHeader"><h3>Log what you actually did</h3><span class="pill ${o.complete===6?'gold':''}">${o.complete===6?'FULL CLEAR!':'QUESTS OPEN'}</span></div><div class="entry" style="margin-bottom:15px;max-width:260px"><label>Today's mode</label><div class="selectrow">${['School','Free','Busy'].map(x=>`<button class="choice ${d.mode===x?'selected':''}" data-mode="${x}">${x}</button>`).join('')}</div></div>${HABITS.map((h,i)=>formHabit(h,d,o.statuses[i])).join('')}<div class="hintbox" style="margin-top:15px">Only log minutes you really spent. Minimum efforts count. XP is never taken away.</div></section><section class="section card"><h3>End-of-day reflection</h3><div class="entry"><label for="win">Today's win</label><textarea id="win" data-text="win" placeholder="What progressed today?">${safe(d.win)}</textarea></div><div class="entry" style="margin-top:13px"><label for="blocker">What got in the way?</label><textarea id="blocker" data-text="blocker" placeholder="No judgment. Just an observation.">${safe(d.blocker)}</textarea></div><div class="entry" style="margin-top:13px"><label for="tomorrow">Tomorrow's first action</label><textarea id="tomorrow" data-text="tomorrow" placeholder="Something easy enough to start.">${safe(d.tomorrow)}</textarea></div><div class="entry" style="margin-top:13px;max-width:165px"><label>Mood (optional)</label><select data-choice="mood"><option value="">Select</option>${['1','2','3','4','5'].map(x=>`<option value="${x}" ${d.mood===x?'selected':''}>${x} / 5</option>`).join('')}</select></div><p class="small">Enter reflection minutes in the quest list above to earn its XP.</p></section></div><div>${workoutView(d)}<section class="card section"><h3>Minecraft PvP quest</h3><div class="eyebrow">DAY ${p.day} · ${safe(p.theme)}</div><div class="mission"><h3 style="font-size:19px">${safe(p.title)}</h3><p>${safe(p.drill)}</p><div class="bigTip"><strong>Checkpoint:</strong> ${safe(p.check)}</div><div class="small">Try it on: <strong style="color:var(--text)">${safe(p.server)}</strong></div><a class="bigLink" href="${safe(p.url)}" target="_blank" rel="noopener noreferrer" style="margin-top:13px">↗ Open today's tutorial</a></div><div class="entry"><label>What improved in PvP today?</label><textarea data-text="pvpLearned" placeholder="Example: I timed my swings instead of spamming.">${safe(d.pvpLearned)}</textarea></div><button style="margin-top:12px" class="button" data-nav="map">See servers and next drills →</button></section><section class="card section"><h3>Chess checkpoint</h3><p class="small" style="line-height:1.65">Try 5 minutes of puzzles, a thoughtful game, then review one mistake. Record the minutes as a completed quest.</p><a href="https://lichess.org/training" target="_blank" rel="noopener noreferrer" class="bigLink">↗ Free chess puzzles on Lichess</a></section></div></div>`}
function renderMap(){const stats=allStats(),info=dateInfo(selected),cur=((info.idx%42)+42)%42;return header('Adventure Map','42 DAYS • SIX CHAPTERS','A different Minecraft PvP challenge every day, plus weekly bosses that reward consistency.')+`<div class="hintbox">Each chapter has seven PvP drills. Complete at least <b>four daily habits on four separate days</b> in a week to defeat that chapter's boss. Your level and XP never reset if you miss a day.</div><div class="section weekgrid">${Array.from({length:6},(_,w)=>{const days=Array.from({length:7},(_,i)=>advance(START,w*7+i));const completions=days.filter(s=>outcome(s).complete>=4).length;const won=completions>=4;return `<div class="weekcard ${won?'defeated':''}"><div class="eyebrow">CHAPTER ${w+1}</div><h3 style="font-size:16px;margin:6px 0">${['Foundations','Aim & Movement','Defensive Play','Control & Combos','Real Fights','Specialist Trials'][w]}</h3>${bar(completions,4,'green')}<div class="small">BOSS: ${won?'DEFEATED':'ACTIVE'} • ${completions}/4 days</div><div class="daynodes">${days.map((s,i)=>{const quest=SOURCE.pvp[w*7+i];return `<button data-day="${s}" title="Day ${w*7+i+1}: ${safe(quest.title)}" class="node ${outcome(s).complete>=4?'complete':''} ${s===selected?'selected':''} ${s===today?'today':''}">${w*7+i+1}</button>`}).join('')}</div></div>`}).join('')}</div><div class="section split"><section class="card"><div class="cardHeader"><h3>Selected training mission</h3><span class="pill">DAY ${pvpQuest(selected).day} / 42</span></div><div class="eyebrow">${safe(pvpQuest(selected).theme)}</div><h2 style="font-family:'Space Grotesk'">${safe(pvpQuest(selected).title)}</h2><p style="line-height:1.7;color:#c9d5e7">${safe(pvpQuest(selected).drill)}</p><div class="bigTip">SELF CHECK — ${safe(pvpQuest(selected).check)}</div><p class="small">Suggested server: ${safe(pvpQuest(selected).server)}</p><a href="${safe(pvpQuest(selected).url)}" target="_blank" rel="noopener noreferrer" class="button primary bigLink">Open skill guide ↗</a><button data-nav="quests" class="button" style="margin-left:8px">Log practice</button><div class="foot">After Day 42, the drill rotation repeats. Your daily logs and XP keep growing.</div></section><section class="card"><h3>PvP practice servers</h3>${SOURCE.servers.filter(s=>s.name!=='NAME').slice(0,7).map(s=>`<div class="server"><div><b>${safe(s.name)}</b><code>${safe(s.ip)}</code><p>${safe(s.for)}</p><p>${safe(s.version)}</p></div><a class="button sm" href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">Info ↗</a></div>`).join('')}<div class="foot">Server version support changes; check current rules before connecting. Java Edition required for these addresses.</div></section></div>`}
function renderTrophies(){const stats=allStats(),a=milestoneData(stats),unlocked=a.filter(x=>x[3]).length;return header('Trophy Room','YOUR ACHIEVEMENTS','Unlock badges by doing the real activities, not by keeping a perfect streak.')+hero(stats)+`<div class="statgrid">${statCard('Unlocked',unlocked+' / '+a.length,'Earn new trophies','accentA')}${statCard('Words drafted',stats.words.toLocaleString(),'Keep writing the novel','accentV')}${statCard('PvP hours',(stats.minutes.pvp/60).toFixed(1),'Intentional practice','accentC')}${statCard('Bosses won',bossWins(),'Four strong days per week','accentG')}</div><div class="section badges">${a.map(([sym,title,desc,got])=>`<div class="badgecard ${got?'':'locked'}"><div class="badgesym">${sym}</div><div><b>${safe(title)} ${got?'<span class="checkmark">✓</span>':''}</b><span>${safe(desc)}</span><div class="small" style="margin-top:7px;color:${got?'#58e4b2':'#98a7c1'}">${got?'UNLOCKED':'LOCKED'}</div></div></div>`).join('')}</div><div class="foot">Trophies are milestone awards, not purchases. Gold is a fun score and does not buy real goods.</div>`}
function renderHistory(){const stats=allStats(),keys=stats.keys.slice().reverse();return header('Quest History','YOUR ADVENTURE RECORD','Look back at actual progress. Tap a day to inspect or edit it.')+`<div class="statgrid">${statCard('Days logged',stats.logged,'Total tracking days','accentG')}${statCard('Words written',stats.words.toLocaleString(),'Manuscript progress','accentV')}${statCard('Chess hours',(stats.minutes.chess/60).toFixed(1),'Thinking practice','accentC')}${statCard('Social hours',(stats.minutes.friends/60).toFixed(1),'Time with friends','accentA')}</div><div class="card section"><div class="historyRow head"><span>DAY</span><span>PROGRESS</span><span>QUESTS</span><span>XP</span></div>${keys.length?keys.map(s=>{const o=outcome(s);return `<button data-day="${s}" class="historyRow" style="background:transparent;color:var(--text);border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer"><span style="font-size:12px">${safe(s)}</span><span>${bar(o.complete,6,'green')}</span><span class="accentC">${o.complete}/6</span><span class="goldtext">${o.xp}</span></button>`}).join(''):`<div class="empty">No days recorded yet. Open Daily Quests and log your first activity.</div>`}</div>`}
function renderSettings(){return header('Save & Settings','MAKE IT YOURS','Play without an account or connect secure automatic cross-device saving.')+`<div class="split"><div class="card"><h3>Adventurer profile</h3><div class="entry"><label for="heroName">Your character name</label><input id="heroName" maxlength="40" value="${safe(state.name)}" placeholder="Adventurer"></div>${renderCloudAccount()}<div class="section"><h3>Save file</h3><div class="row"><button class="button primary" id="exportSave">↓ Export backup (.json)</button><button class="button" id="importSave">↑ Import backup (.json)</button></div><p class="small" style="line-height:1.7">Backups are recommended even with a cloud account. On an account, importing merges with existing cloud days and replaces duplicate dates; offline mode replaces the local save.</p></div><div class="section"><h3>Spreadsheet companion</h3><p class="small" style="line-height:1.7">Your Excel planner is a separate tracker. Changes in the game do not automatically appear in Excel, or vice versa.</p><button class="button" id="exportCsv">↓ Export CSV of daily logs</button><p class="small">Use this file for your own records or to copy entries into Excel. The column layout is a simplified report, not an automatic spreadsheet sync.</p></div></div><div class="card"><h3>Rules of the game</h3><div class="planLine">✦ <b>20 XP</b> per completed minimum quest</div><div class="planLine">✦ <b>+10 XP</b> when you reach the full target</div><div class="planLine">✦ <b>+15 bonus XP</b> for four or five quests</div><div class="planLine">✦ <b>+50 bonus XP</b> for all six quests</div><div class="planLine">✦ <b>10 gold</b> per completed quest, plus 25 on full-clear days</div><div class="planLine">✦ <b>200 XP</b> per level</div><div class="planLine">✦ <b>Streak</b> for 3+ quests on consecutive logged calendar days</div><div class="planLine">✦ <b>Weekly boss</b> defeated by four 4+/6 days</div><p class="bigTip">Miss a day? Your XP, levels, coins, and trophies remain. You can always resume.</p><div class="foot">Guest mode works locally. Account mode syncs days over HTTPS using your own configured Supabase project. Simultaneous edits to the same date on different devices use last-write-wins. No workouts are automatically verified.</div></div></div>`}
const renderers={home:renderHome,character:renderCharacter,quests:renderQuests,map:renderMap,trophies:renderTrophies,history:renderHistory,settings:renderSettings};
function render(){sideNavigation();const root=document.getElementById('app');root.innerHTML=(renderers[page]||renderHome)();bind();}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),2400)}
function fileDownload(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvExport(){const rows=[['Date','Mode','Equipment','Writing minutes','Words','Movement minutes','Chess minutes','Friends minutes','Reflection minutes','PvP minutes','Recovery logged','Quests completed','XP','Gold','Win','Obstacle','Tomorrow','PvP learning','Mood']];
 Object.keys(state.days).sort().forEach(k=>{const o=outcome(k),d=o.d;rows.push([k,d.mode,d.equipment,d.writing,d.words,d.movement,d.chess,d.friends,d.journal,d.pvp,d.restDone?'Yes':'No',o.complete,o.xp,o.gold,d.win,d.blocker,d.tomorrow,d.pvpLearned,d.mood]);});
 const csv=rows.map(row=>row.map(cell=>'"'+String(cell??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');fileDownload('questlog-daily-records.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV exported.');}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>changePage(b.dataset.nav)));bindCloudButtons();
 document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.day;changePage('quests')}));
 document.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click',()=>selectDate(advance(selected,+b.dataset.shift))));
 const date=document.getElementById('dateSelector');if(date)date.addEventListener('change',e=>selectDate(e.target.value));
 document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>increment(b.dataset.add,+b.dataset.min)));
 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>edit('mode',b.dataset.mode)));
 document.querySelectorAll('[data-equip]').forEach(b=>b.addEventListener('click',()=>edit('equipment',b.dataset.equip)));
 document.querySelectorAll('[data-number]').forEach(input=>input.addEventListener('change',()=>edit(input.dataset.number,Math.max(0,Math.min(9999,Math.floor(+input.value||0))))));
 document.querySelectorAll('[data-text]').forEach(input=>input.addEventListener('input',()=>{const d=getDay(selected);d[input.dataset.text]=input.value;state.days[selected]=d;save()}));
 const mood=document.querySelector('[data-choice="mood"]');if(mood)mood.addEventListener('change',e=>edit('mood',e.target.value));
 const rest=document.getElementById('restDone');if(rest)rest.addEventListener('change',e=>edit('restDone',e.target.checked));
 const name=document.getElementById('heroName');if(name)name.addEventListener('change',e=>{state.name=e.target.value.slice(0,40).trim()||'Adventurer';save('profile');toast('Character saved.');});
 const exportBtn=document.getElementById('exportSave');if(exportBtn)exportBtn.addEventListener('click',()=>{fileDownload('questlog-save.json',JSON.stringify({version:1,...state},null,2),'application/json');toast('Backup downloaded.');});
 const importBtn=document.getElementById('importSave');if(importBtn)importBtn.addEventListener('click',()=>document.getElementById('saveImport').click());
 const csvBtn=document.getElementById('exportCsv');if(csvBtn)csvBtn.addEventListener('click',csvExport);
}
const fileInput=document.getElementById('saveImport');fileInput.addEventListener('change',async function(){const f=this.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.days||typeof v.days!=='object'||Array.isArray(v.days))throw new Error('This does not look like a Questlog save.');if(!confirm('Import this backup? Guest mode will replace the local data. Cloud mode will merge dates; matching days will use the imported entries. Export a backup first if needed.'))return;state={name:String(v.name||'Adventurer').slice(0,40),days:v.days};save();render();toast('Your adventure has been restored.')}catch(e){alert('Could not load save: '+e.message)}this.value='';});

// Cloud sync is opt-in and uses only the public/publishable key. Never use a secret/service-role key here.
const cloud={client:null,user:null,status:'local',message:'',loadingUid:null,flushing:false,timer:null};
const cloudCfg=window.QUESTLOG_CONFIG||{};
const cloudEnabled=typeof cloudCfg.supabaseUrl==='string'&&/^https:\/\/[a-z0-9.-]+\/?$/i.test(cloudCfg.supabaseUrl)&&!!cloudCfg.supabasePublishableKey&&!String(cloudCfg.supabasePublishableKey).includes('REPLACE');
function syncLabel(){
 if(!cloudEnabled)return '◌ Guest · Setup cloud';
 if(!cloud.user)return '◌ Guest · Sign in';
 const pending=getPending().size;
 if(cloud.status==='error')return `⚠ ${pending} change(s) queued`;
 if(pending||cloud.status==='syncing')return `↻ Saving · ${pending} queued`;
 return '✓ Cloud saved';
}
const cacheKey=()=>`questlog-online-cache-${cloud.user.id}`;
const pendingKey=()=>`questlog-online-pending-${cloud.user.id}`;
function getPending(){try{return new Set(JSON.parse(localStorage.getItem(pendingKey())||'[]'))}catch(e){return new Set()}}
function setPending(x){localStorage.setItem(pendingKey(),JSON.stringify([...x]));}
function queueCloud(){if(!cloud.user)return;cloud.status='syncing';clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>void flushCloud(),700)}
async function flushCloud(){
 if(!cloud.user||cloud.flushing||!cloud.client)return;
 cloud.flushing=true;const uid=cloud.user.id;
 try{
  for(const key of [...getPending()]){
   if(!cloud.user||cloud.user.id!==uid)break;
   const payload=key==='@profile'?state.name:JSON.stringify(state.days[key]||defaultDay());
   const record=key==='@profile'?{user_id:uid,display_name:payload}:{user_id:uid,log_date:key,entry:JSON.parse(payload)};
   const table=key==='@profile'?'questlog_profiles':'questlog_days';
   const {error}=await cloud.client.from(table).upsert(record,{onConflict:key==='@profile'?'user_id':'user_id,log_date'});
   if(error)throw error;
   const latest=key==='@profile'?state.name:JSON.stringify(state.days[key]||defaultDay());
   if(latest===payload){const pending=getPending();pending.delete(key);setPending(pending)}
  }
  cloud.status=getPending().size?'syncing':'connected';cloud.message='Your changes are saved to your account.';
 }catch(e){cloud.status='error';cloud.message='Offline or cloud error: '+String(e.message||e)+' — changes remain queued on this device.';}
 finally{cloud.flushing=false;if(page==='settings'||page==='home'||page==='character')render();}
}
async function refreshCloud(){
 if(!cloud.user||!cloud.client||cloud.flushing||cloud.loadingUid)return;
 const uid=cloud.user.id;
 try{
  const [prof,days]=await Promise.all([
   cloud.client.from('questlog_profiles').select('display_name').eq('user_id',uid).maybeSingle(),
   cloud.client.from('questlog_days').select('log_date,entry').eq('user_id',uid).order('log_date',{ascending:true})
  ]);
  if(prof.error)throw prof.error;if(days.error)throw days.error;
  if(!cloud.user||cloud.user.id!==uid)return;
  const pending=getPending();const before=JSON.stringify(state);
  const newDays={};
  for(const row of days.data||[])if(/^\d{4}-\d\d-\d\d$/.test(row.log_date)&&row.entry&&typeof row.entry==='object')newDays[row.log_date]=row.entry;
  for(const key of pending)if(key!=='@profile'&&state.days[key])newDays[key]=state.days[key];
  state={name:pending.has('@profile')?state.name:(prof.data?.display_name||'Adventurer'),days:newDays};
  localStorage.setItem(cacheKey(),JSON.stringify(state));
  cloud.status=pending.size?'syncing':'connected';cloud.message=pending.size?'Unsynced edits are saved on this device.':'All changes are saved to your account.';
  if(before!==JSON.stringify(state)&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA')render();
 }catch(e){cloud.status='error';cloud.message='Unable to refresh: '+String(e.message||e);if(page==='settings')render();}
}
async function activateAccount(user){
 if(!user)return;const uid=user.id;
 if(cloud.user?.id===uid)return;
 if(cloud.loadingUid===uid)return;
 cloud.loadingUid=uid;cloud.status='syncing';cloud.message='Loading your account...';render();
 // Account progress is never implicitly mixed with device guest progress.
 let cached;
 try{cached=JSON.parse(localStorage.getItem(`questlog-online-cache-${uid}`)||'null')}catch(e){}
 try{
  const [p,d]=await Promise.all([
    cloud.client.from('questlog_profiles').select('display_name').eq('user_id',uid).maybeSingle(),
    cloud.client.from('questlog_days').select('log_date,entry').eq('user_id',uid)
  ]);
  if(p.error)throw p.error;if(d.error)throw d.error;
  const pending=new Set(JSON.parse(localStorage.getItem(`questlog-online-pending-${uid}`)||'[]'));
  const remoteDays=Object.fromEntries((d.data||[]).filter(r=>/^\d{4}-\d\d-\d\d$/.test(r.log_date)).map(r=>[r.log_date,r.entry]));
  for(const key of pending)if(key!=='@profile'&&cached?.days?.[key])remoteDays[key]=cached.days[key];
  state={name:pending.has('@profile')?String(cached?.name||'Adventurer'):String(p.data?.display_name||'Adventurer'),days:remoteDays};
  cloud.user=user;cloud.status=pending.size?'syncing':'connected';cloud.message='Signed in as '+user.email;
  localStorage.setItem(cacheKey(),JSON.stringify(state));
  render();if(pending.size)queueCloud();
 }catch(e){cloud.message='Could not open cloud account: '+String(e.message||e);cloud.status='error';render();}
 finally{cloud.loadingUid=null;}
}
function leaveAccount(){
 clearTimeout(cloud.timer);cloud.user=null;cloud.status='local';
 try{const v=JSON.parse(localStorage.getItem(KEY)||'null');state=v?.days?{name:String(v.name||'Adventurer'),days:v.days}:{name:'Adventurer',days:{}}}catch(e){state={name:'Adventurer',days:{}}}
 render();
}
function renderCloudAccount(){
 const message=cloud.message?`<p class="syncNotice ${cloud.status==='connected'?'synced':''}">${safe(cloud.message)}</p>`:'';
 if(!cloudEnabled)return `<div class="section"><h3>Account & automatic cloud saving</h3><div class="syncNotice">Cloud is not configured yet. You can try all quests and character upgrades offline now. To enable login, follow SETUP.md and add your Supabase project URL and <b>publishable</b> key to config.js; then host the game over HTTPS.</div><div class="accountActions"><a class="button" href="https://supabase.com/dashboard/projects" target="_blank" rel="noopener noreferrer">Open Supabase ↗</a></div></div>`;
 if(cloud.user)return `<div class="section"><h3>Account & automatic cloud saving</h3><p class="authHelp">Signed in as <strong>${safe(cloud.user.email||'your account')}</strong>. Changes save to this device immediately, then to Supabase automatically while online. Other devices check for updates when you return to the game or every 30 seconds.</p>${message}<div class="accountActions"><button id="cloudSync" class="button primary">↻ Sync now</button><button id="cloudImportGuest" class="button">Import guest progress</button><button id="cloudLogout" class="button ghost">Sign out</button></div><p class="small">Import guest progress only if you want it merged into this account; dates from guest progress override matching account dates. Your local backup remains available.</p></div>`;
 return `<div class="section"><h3>Account & automatic cloud saving</h3><p class="authHelp">Create an account once, then log in with the same email and password on your PC and phone. Your saves are private to your account.</p>${message}<div class="authgrid"><div class="entry"><label for="cloudEmail">Email</label><input type="email" id="cloudEmail" autocomplete="username" placeholder="you@example.com"></div><div class="entry"><label for="cloudPassword">Password (8+ characters)</label><input type="password" id="cloudPassword" autocomplete="current-password" minlength="8" placeholder="Your password"></div></div><div class="accountActions"><button id="cloudLogin" class="button primary">Sign in</button><button id="cloudSignup" class="button">Create account</button></div><p class="small">You may need to confirm your email before the account becomes active. Guest progress is not uploaded unless you choose to import it after signing in.</p></div>`;
}
function bindCloudButtons(){
 const login=document.getElementById('cloudLogin'),signup=document.getElementById('cloudSignup');
 async function authAction(kind){
   if(!cloud.client)return;
   const email=document.getElementById('cloudEmail')?.value?.trim()||'';
   const password=document.getElementById('cloudPassword')?.value||'';
   if(!email.includes('@')||password.length<8){cloud.message='Enter a valid email and password of at least 8 characters.';render();return}
   cloud.message='Contacting account server...';
   const result=kind==='signup'?await cloud.client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await cloud.client.auth.signInWithPassword({email,password});
   if(result.error)cloud.message=result.error.message;
   else if(kind==='signup'&&!result.data.session)cloud.message='Check your email for a confirmation link, then sign in.';
   else cloud.message='Signed in — loading your character...';
   render();
 }
 if(login)login.addEventListener('click',()=>void authAction('login'));
 if(signup)signup.addEventListener('click',()=>void authAction('signup'));
 const logout=document.getElementById('cloudLogout');if(logout)logout.addEventListener('click',async()=>{
   if(getPending().size&&!confirm('Some edits are still queued on this device. Sign out anyway?'))return;
   const {error}=await cloud.client.auth.signOut();if(error){cloud.message=error.message;render();}
   else leaveAccount();
 });
 const sync=document.getElementById('cloudSync');if(sync)sync.addEventListener('click',async()=>{await flushCloud();await refreshCloud();render()});
 const guest=document.getElementById('cloudImportGuest');if(guest)guest.addEventListener('click',()=>{
   let v;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
   if(!v?.days||!Object.keys(v.days).length){toast('No guest progress found.');return}
   if(!confirm('Merge guest logs into this account? Any matching dates will use the guest version.'))return;
   state.days={...state.days,...v.days};save('all');cloud.message='Guest logs added to account. Cloud sync queued.';render();
 });
}
async function initCloud(){
 if(!cloudEnabled){cloud.message='Offline guest mode';return;}
 try{
   if(!window.supabase){await new Promise((resolve,reject)=>{
     const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=resolve;sc.onerror=()=>reject(Error('Could not load Supabase JS. Check internet.'));document.head.appendChild(sc)
   });}
   cloud.client=window.supabase.createClient(cloudCfg.supabaseUrl,cloudCfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   cloud.client.auth.onAuthStateChange((event,session)=>{
      if(session?.user){setTimeout(()=>void activateAccount(session.user),0)}
      else if(event==='SIGNED_OUT')setTimeout(()=>leaveAccount(),0)
   });
   const {data,error}=await cloud.client.auth.getSession();if(error)throw error;
   if(data.session?.user)await activateAccount(data.session.user);
   else{cloud.status='local';render()}
   window.addEventListener('online',()=>{if(cloud.user)void flushCloud().then(refreshCloud)});
   window.addEventListener('focus',()=>{if(cloud.user)void flushCloud().then(refreshCloud)});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.user)void flushCloud().then(refreshCloud)});
   setInterval(()=>{if(!document.hidden&&cloud.user)void flushCloud().then(refreshCloud)},30000);
 }catch(e){cloud.status='error';cloud.message='Cloud unavailable. Local guest mode still works: '+String(e.message||e);render()}
}
const SKILLS=[
 {id:'movement',code:'STR',name:'Strength',color:'#f28f88',detail:'Workout strength & recovery'},
 {id:'chess',code:'INT',name:'Intelligence',color:'#9bc1ff',detail:'Chess calculation & tactics'},
 {id:'pvp',code:'DEX',name:'Dexterity',color:'#60e1c6',detail:'Minecraft PvP execution'},
 {id:'writing',code:'CRE',name:'Creativity',color:'#caa7ff',detail:'Storytelling & book writing'},
 {id:'friends',code:'CHA',name:'Charisma',color:'#ffd085',detail:'Social quests & friends'},
 {id:'journal',code:'WIS',name:'Wisdom',color:'#9fdaea',detail:'Reflection & self-awareness'}
];
function characterScores(){return SKILLS.map(x=>{
 let points=0,days=0;
 for(const s of Object.keys(state.days)){
   const status=progress(getDay(s),s,x.id);if(status==='Not yet')continue;
   points+=status==='Full'?2:1;days++;
 }
 return {...x,points,days,level:1+Math.floor(points/5),progress:points%5};
})}
function avatarVisual(){
 const stats=Object.fromEntries(characterScores().map(s=>[s.code,s.points]));
 const str=Math.min(20,stats.STR||0),int=Math.min(20,stats.INT||0),dex=Math.min(20,stats.DEX||0),cre=Math.min(20,stats.CRE||0),cha=Math.min(20,stats.CHA||0),wis=Math.min(20,stats.WIS||0);
 const arms=9+str*.7,shoulder=28+str*.8,headGlow=Math.min(.85,int*.045),aura=Math.min(.52,wis*.024);
 // Rendered, stat-dependent SVG RPG character. Every visual changes only when a real activity is logged.
 return `<div class="avatarWindow" role="img" aria-label="RPG hero avatar upgraded by Strength, Intelligence, Dexterity, Creativity, Charisma and Wisdom"><svg viewBox="0 0 260 285" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <defs><radialGradient id="questAura"><stop offset="0" stop-color="#7c7bef" stop-opacity=".58"/><stop offset="1" stop-color="#7c7bef" stop-opacity="0"/></radialGradient><linearGradient id="armor" x2="1" y2="1"><stop stop-color="#a6a9d8"/><stop offset="1" stop-color="#424b7b"/></linearGradient></defs>
 <ellipse cx="130" cy="136" rx="${86+wis}" ry="${106+wis}" fill="url(#questAura)" opacity="${.27+aura}"/>
 ${wis>=2?`<ellipse cx="130" cy="132" rx="${72+wis}" ry="${92+wis}" fill="none" stroke="#d7c4ff" stroke-width="2" opacity="${aura+.12}" stroke-dasharray="8 9"/>`:''}
 <ellipse cx="130" cy="254" rx="70" ry="12" fill="#0b101f" opacity=".9"/>
 ${dex>=2?`<path d="M52 199 L24 207 M205 190 L233 180 M42 214 L21 226" stroke="#70f2dc" stroke-width="${Math.min(5,1+dex/7)}" opacity="${Math.min(.9,.3+dex/35)}" stroke-linecap="round"/>`:''}
 <!-- legs -->
 <path d="M${108-shoulder*.14} 199 L${105-shoulder*.14} 241 L124 245 L130 198 Z" fill="#2d385b" stroke="#8c9dcb" stroke-width="2"/>
 <path d="M134 198 L137 245 L157 240 L${146+shoulder*.14} 197 Z" fill="#2d385b" stroke="#8c9dcb" stroke-width="2"/>
 <path d="M96 237 L124 237 L127 252 L88 252 Z M137 237 L160 237 L169 252 L135 252 Z" fill="${dex>=5?'#48bfbd':'#384966'}" stroke="#acc2e4" stroke-width="2"/>
 <!-- arms scale with STR -->
 <rect x="${130-shoulder-arms/1.6}" y="113" width="${arms+5}" height="77" rx="${arms/2}" fill="url(#armor)" stroke="#c4bbf4" stroke-width="2" transform="rotate(8 ${130-shoulder} 113)"/>
 <rect x="${130+shoulder-5}" y="113" width="${arms+5}" height="77" rx="${arms/2}" fill="url(#armor)" stroke="#c4bbf4" stroke-width="2" transform="rotate(-8 ${130+shoulder} 113)"/>
 <!-- body -->
 <path d="M${130-shoulder} 111 Q130 102 ${130+shoulder} 111 L${145+str*.2} 203 L${115-str*.2} 203 Z" fill="url(#armor)" stroke="#c5c9ed" stroke-width="2.8"/>
 <path d="M117 137 L130 151 L143 137 M130 153 L130 193" fill="none" stroke="#ede2ad" stroke-width="3"/>
 <path d="M${110-shoulder*.4} 177 Q130 190 ${150+shoulder*.4} 177" fill="none" stroke="#162638" stroke-width="9"/>
 <path d="M${130-shoulder-9} 110 L${130-shoulder+15} 109 L${130-shoulder+11} 132 L${130-shoulder-13} 131 Z M${130+shoulder-14} 109 L${130+shoulder+9} 110 L${130+shoulder+13} 132 L${130+shoulder-10} 131 Z" fill="#7786b5" stroke="#d3d4f5" stroke-width="2"/>
 <!-- face -->
 <rect x="99" y="65" width="62" height="62" rx="22" fill="#c8d7e1" stroke="#f6ead5" stroke-width="3"/>
 <path d="M96 85 Q130 45 164 84 L160 99 L100 99 Z" fill="#6e70bb" stroke="#cdc5ff" stroke-width="3"/>
 <path d="M110 96 L124 99 M136 99 L150 96" stroke="#35435e" stroke-width="4" stroke-linecap="round"/>
 <path d="M121 112 Q130 117 139 112" fill="none" stroke="#596485" stroke-width="2" stroke-linecap="round"/>
 ${int>=2?`<g opacity="${headGlow}"><path d="M93 70 Q130 39 167 70" stroke="#b5defd" stroke-width="4" fill="none"/><circle cx="130" cy="46" r="${4+int/5}" fill="#b3e2ff"/><path d="M117 44 L106 32 M143 44 L154 32" stroke="#b3e2ff" stroke-width="2"/></g>`:''}
 ${wis>=5?`<path d="M124 88 Q130 83 136 88 Q130 93 124 88" fill="#dbafff" opacity="${Math.min(1,wis/15)}"/>`:''}
 ${cre>=2?`<g opacity="${Math.min(1,.3+cre*.05)}"><path d="M176 98 L188 45 L197 57 L178 105" fill="#d5b6ff"/><path d="M193 55 Q204 37 200 25 Q183 29 188 50" fill="#ffe5b2"/><circle cx="188" cy="39" r="3" fill="#faf0ff"/></g>`:''}
 ${cha>=2?`<g><circle cx="59" cy="71" r="${6+cha/6}" fill="#ffcf76" stroke="#fff0c8" stroke-width="2"/><path d="M54 71 L57 74 L64 67" stroke="#6e4f36" fill="none" stroke-width="2"/>${cha>=8?`<circle cx="206" cy="87" r="10" fill="#ffd78f" stroke="#fff5d9" stroke-width="2"/>`:''}</g>`:''}
 </svg><div class="small" style="position:absolute;bottom:12px;text-align:center">Your hero evolves as you complete real-world quests</div></div>`;
}
function skillPanel(){const list=characterScores();return `<div class="avatarInfo"><h3>Character attributes</h3><p class="small">Each minimum quest earns 1 attribute point; a full target earns 2. Every 5 points increases that attribute's level.</p><div class="skillGrid">${list.map(x=>`<div class="skillRow"><div class="skillHead"><b style="color:${x.color}">${x.code} · ${x.name}</b><span>LV ${x.level}</span></div>${bar(x.progress,5)}<div class="small">${x.points} ${x.points===1?'point':'points'} • ${x.days} quest ${x.days===1?'day':'days'}</div></div>`).join('')}</div><div class="foot">These are fictional progress stats based on your entries, not measurements of your body or intelligence.</div></div>`;}
function characterDeck(){return `<div class="characterDeck">${avatarVisual()}${skillPanel()}</div>`;}
function renderCharacter(){const s=allStats();return header('Your Character','BUILD YOUR HERO','Complete real-world quests to make your character visibly stronger, wiser, more creative, and more capable.')+hero(s)+characterDeck()+`<div class="card"><h3>How evolutions work</h3><div class="planLine">◆ Strength raises the hero's shoulder and arm armour.</div><div class="planLine">♞ Intelligence adds a scholar halo and focus effects.</div><div class="planLine">⚔ Dexterity unlocks speed trails and improved boots.</div><div class="planLine">✎ Creativity creates a magical quill beside your hero.</div><div class="planLine">♧ Charisma adds little allies and companions.</div><div class="planLine">✧ Wisdom illuminates your aura and mystic markings.</div><div class="small">This visual is generated from your saved records. Edit any day in Daily Quests and the hero updates immediately.</div><div class="section"><button class="button primary" data-nav="quests">Complete a quest →</button></div></div>`;}

render();
void initCloud();
</script></body></html>
